[package]
name = "maxi-sound-set"
version = "1.0.1"
edition = "2021"
rust-version = "1.98"
description = "Adaptive Windows loudness control with a Slint desktop interface"
license = "GPL-3.0-only"
build = "build.rs"

[dependencies]
anyhow = "1"
slint = { version = "=1.18.0", default-features = false, features = ["std", "compat-1-2", "backend-winit", "renderer-software", "system-tray"] }
i-slint-core = { version = "=1.18.0", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
log = { version = "0.4", features = ["std"] }
chrono = { version = "0.4", default-features = false, features = ["clock"] }
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls"] }
sha2 = "0.10"
zip = { version = "2.4", default-features = false, features = ["deflate"] }
regex = "1"
png = "0.17"

[target.'cfg(windows)'.dependencies]
windows-core = "0.61"
windows = { version = "0.61", features = ["Win32_Foundation", "Win32_System_Com", "Win32_System_Com_StructuredStorage", "Win32_System_Variant", "Win32_System_Threading", "Win32_System_Diagnostics_ToolHelp", "Win32_System_LibraryLoader", "Win32_Media_Audio", "Win32_Media_Audio_Endpoints", "Win32_UI_Shell_PropertiesSystem", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging", "Win32_Devices_FunctionDiscovery", "Win32_Graphics_Gdi", "Win32_Security", "Win32_Security_WinTrust", "Win32_Security_Cryptography", "Win32_System_Registry", "Win32_Storage_FileSystem"] }

[build-dependencies]
slint-build = "=1.18.0"
embed-resource = "3"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = "symbols"

[profile.dev]
debug = 0

[profile.test]
debug = 0
