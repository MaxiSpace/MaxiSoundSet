name: Windows build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: App and custom installer (Windows x64)
    runs-on: windows-2022
    timeout-minutes: 60
    env:
      CARGO_TERM_COLOR: always
      RUST_BACKTRACE: 1
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Install Rust 1.98.1
        run: |
          rustup toolchain install 1.98.1 --profile minimal
          if ($LASTEXITCODE -ne 0) { throw 'Rust toolchain installation failed.' }
          rustup default 1.98.1
          if ($LASTEXITCODE -ne 0) { throw 'Rust toolchain selection failed.' }
          rustc --version
          cargo --version

      - name: Build and test app and installer
        run: ./.github/scripts/Build-Windows.ps1

      - name: Upload unsigned Windows binaries and SHA-256 checksums
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: MaxiSoundSet-windows-x64-unsigned-${{ github.sha }}
          path: artifacts/windows-x64/*
          if-no-files-found: error
          retention-days: 14
